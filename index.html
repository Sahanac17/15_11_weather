<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow"></div>
  <main class="wrap">
    <h1>Weather App</h1>
    <form class="search" id="search-form">
      <input type="text" id="city-input" placeholder="Type a city name..." aria-label="City name">
      <button type="submit">Search</button>
    </form>

    <p class="message" id="message" aria-live="polite" hidden></p>

    <section class="result" id="result" hidden>
      <div class="info">
        <h2 id="place"></h2>
        <p class="time" id="time"></p>
        <div class="big">
          <img id="icon" alt="" width="64" height="64">
          <p class="temp" id="temp"></p>
        </div>
        <p class="desc" id="desc"></p>
      </div>
      <ul class="facts">
        <li><span>Feels like</span><b id="feels"></b></li>
        <li><span>Humidity</span><b id="humidity"></b></li>
        <li><span>Wind</span><b id="wind"></b></li>
      </ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
