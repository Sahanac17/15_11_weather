<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Nine mockup</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Arial,sans-serif;background:#eef2f7;color:#233;padding:24px 16px 56px}
.head{max-width:1400px;margin:0 auto 20px}
.head h1{font-size:28px;margin-bottom:6px}
.head p{color:#556;line-height:1.5;max-width:720px}
.section{max-width:1400px;margin:28px auto 14px;font-size:20px}
.row{display:flex;flex-wrap:wrap;gap:28px;max-width:1400px;margin:0 auto}
figure{display:flex;flex-direction:column;gap:10px}
figcaption{font-weight:700;font-size:14px;color:#445}
.bezel{background:#1b1f27;border:10px solid #1b1f27;overflow:hidden}
.bezel.phone{border-radius:38px}
.bezel.laptop{border-radius:14px 14px 0 0;border-bottom-width:14px}
.base{height:10px;background:#c9ced6;border-radius:0 0 14px 14px;margin:-10px -22px 0}
.screen{position:relative;overflow:hidden}
.screen.phone{width:280px;height:540px;border-radius:28px}
.screen.laptop{width:640px;height:380px;border-radius:4px}
input,button{font:inherit;border:0;outline:0}
ul{list-style:none}

.screen{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Varela Round",Nunito,Quicksand,system-ui,sans-serif;color:#1d4468;background:linear-gradient(180deg,#6fbcff 0%,#bfe3ff 55%,#eef8ff 100%)}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:96px;height:28px;top:26px;left:-18px}.c1::before{width:42px;height:42px;top:-20px;left:14px}.c1::after{width:30px;height:30px;top:-12px;left:50px}
.c2{width:80px;height:24px;bottom:36px;right:-16px}.c2::before{width:36px;height:36px;top:-16px;left:12px}.c2::after{width:26px;height:26px;top:-10px;left:42px}
.c3{width:70px;height:22px;bottom:110px;left:-14px;opacity:.6}.c3::before{width:32px;height:32px;top:-14px;left:10px}.c3::after{width:24px;height:24px;top:-9px;left:36px}
.wrap{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.phone .wrap{padding:28px 16px}.laptop .wrap{padding:26px 40px;max-width:600px;margin:0 auto;gap:12px}
.wrap h1{font-size:26px;letter-spacing:.3px;color:#14507f}.laptop .wrap h1{font-size:32px}
.search{display:flex;gap:8px;width:100%}
.search input{flex:1;min-width:0;padding:11px 16px;border-radius:999px;background:#fff;color:#1d4468;box-shadow:0 4px 14px rgba(40,120,200,.2)}
.search input::placeholder{color:#7e9ab5}
.search button{padding:11px 18px;border-radius:999px;background:#2f8fe8;color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(40,120,200,.35)}
.msg{font-weight:700;color:#14507f;margin-top:6px}
.card{width:100%;background:#fff;border-radius:30px;padding:18px;text-align:center;box-shadow:0 12px 30px rgba(47,143,232,.25)}
.card h2{font-size:18px;color:#14507f}.time{font-size:12px;color:#6c8aa6;margin-top:3px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 2px}
.icon{font-size:46px;line-height:1}.temp{font-size:50px;font-weight:800;color:#14507f}
.desc{font-weight:700;color:#3c7fb8}
.facts{margin-top:12px;display:grid;gap:8px}
.facts li{display:flex;justify-content:space-between;background:#eef7ff;border-radius:16px;padding:9px 14px;font-size:14px}
.facts span{color:#5d84a6}
.laptop .card.result{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:center;text-align:center}
.laptop .facts{margin-top:0}
.notfound .icon{font-size:40px;margin-bottom:6px}.notfound p{color:#5d84a6;margin-top:4px;font-size:14px}
</style></head><body>
<div class="head"><h1>Cloud Nine</h1><p>Soft sky-blue page, drifting clouds and one big puffy white card. Mockup only: nothing here works yet, and the weather values are made up.</p></div>
<h2 class="section">Phone-sized screen</h2><div class="row">
<figure><figcaption>1. Before searching</figcaption><div class="bezel phone"><div class="screen phone"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><main class="wrap"><h1>Weather App</h1>
<div class="search"><input value="" placeholder="Type a city name..." readonly><button type="button">Search</button></div>
</main></div></div></figure>
<figure><figcaption>2. Loading</figcaption><div class="bezel phone"><div class="screen phone"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><main class="wrap"><h1>Weather App</h1>
<div class="search"><input value="Paris" placeholder="Type a city name..." readonly><button type="button">Search</button></div>
<p class="msg">Loading...</p></main></div></div></figure>
<figure><figcaption>3. Weather result</figcaption><div class="bezel phone"><div class="screen phone"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><main class="wrap"><h1>Weather App</h1>
<div class="search"><input value="London" placeholder="Type a city name..." readonly><button type="button">Search</button></div>
<section class="card result">
<div class="left"><h2>London, United Kingdom</h2><p class="time">Local time: Sat 15 Nov, 14:32</p>
<div class="big"><span class="icon">&#9925;</span><span class="temp">24&deg;C</span></div><p class="desc">Partly cloudy</p></div>
<ul class="facts"><li><span>Feels like</span><b>25&deg;C</b></li><li><span>Humidity</span><b>58%</b></li><li><span>Wind</span><b>14 km/h NW</b></li></ul>
</section></main></div></div></figure>
<figure><figcaption>4. City not found</figcaption><div class="bezel phone"><div class="screen phone"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><main class="wrap"><h1>Weather App</h1>
<div class="search"><input value="Londno" placeholder="Type a city name..." readonly><button type="button">Search</button></div>
<section class="card notfound"><div class="icon">&#128270;</div><h2>Hmm, we couldn't find that city</h2><p>Check the spelling and try again.</p></section></main></div></div></figure>
</div>
<h2 class="section">Laptop-sized screen</h2><div class="row">
<figure><figcaption>1. Before searching</figcaption><div class="bezel laptop"><div class="screen laptop"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><main class="wrap"><h1>Weather App</h1>
<div class="search"><input value="" placeholder="Type a city name..." readonly><button type="button">Search</button></div>
</main></div></div><div class="base"></div></figure>
<figure><figcaption>2. Loading</figcaption><div class="bezel laptop"><div class="screen laptop"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><main class="wrap"><h1>Weather App</h1>
<div class="search"><input value="Paris" placeholder="Type a city name..." readonly><button type="button">Search</button></div>
<p class="msg">Loading...</p></main></div></div><div class="base"></div></figure>
<figure><figcaption>3. Weather result</figcaption><div class="bezel laptop"><div class="screen laptop"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><main class="wrap"><h1>Weather App</h1>
<div class="search"><input value="London" placeholder="Type a city name..." readonly><button type="button">Search</button></div>
<section class="card result">
<div class="left"><h2>London, United Kingdom</h2><p class="time">Local time: Sat 15 Nov, 14:32</p>
<div class="big"><span class="icon">&#9925;</span><span class="temp">24&deg;C</span></div><p class="desc">Partly cloudy</p></div>
<ul class="facts"><li><span>Feels like</span><b>25&deg;C</b></li><li><span>Humidity</span><b>58%</b></li><li><span>Wind</span><b>14 km/h NW</b></li></ul>
</section></main></div></div><div class="base"></div></figure>
<figure><figcaption>4. City not found</figcaption><div class="bezel laptop"><div class="screen laptop"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><main class="wrap"><h1>Weather App</h1>
<div class="search"><input value="Londno" placeholder="Type a city name..." readonly><button type="button">Search</button></div>
<section class="card notfound"><div class="icon">&#128270;</div><h2>Hmm, we couldn't find that city</h2><p>Check the spelling and try again.</p></section></main></div></div><div class="base"></div></figure>
</div></body></html>
